
name: Run specific Maven test class

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test-class:
    name: Run DrumPadTest
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Java
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Run DrumPadTest class
        run: mvn test -Dtest=DrumPadTest
